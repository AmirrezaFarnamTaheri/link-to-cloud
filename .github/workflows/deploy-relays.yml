name: Deploy source relays

on:
  workflow_dispatch:
    inputs:
      target:
        description: Relay target to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - cloudflare
          - netlify
          - github

permissions:
  contents: read

jobs:
  cloudflare:
    if: ${{ inputs.target == 'all' || inputs.target == 'cloudflare' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment secrets
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "${#RELAY_SHARED_SECRET}" -ge 32
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Cloudflare Worker relay
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          secret_file="$RUNNER_TEMP/link-to-cloud-relay.env"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          printf 'RELAY_SHARED_SECRET=%s\n' "$RELAY_SHARED_SECRET" > "$secret_file"
          npx --yes wrangler@4.146.0 deploy \
            --config relay/cloudflare/wrangler.jsonc \
            --secrets-file "$secret_file"

  netlify:
    if: ${{ inputs.target == 'all' || inputs.target == 'netlify' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment secrets
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test "${#RELAY_SHARED_SECRET}" -ge 32
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
      - name: Store Netlify relay secret
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27.10.2 env:set RELAY_SHARED_SECRET "$RELAY_SHARED_SECRET" \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --scope functions --context production --secret
      - name: Deploy Netlify relay
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27.10.2 deploy \
            --prod --no-build \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_ID" \
            --dir relay/netlify/public \
            --functions netlify/functions


  github:
    if: ${{ inputs.target == 'all' || inputs.target == 'github' }}
    runs-on: [self-hosted, linux, link-to-cloud-relay]
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate GitHub relay host
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
          RELAY_DOMAIN: ${{ vars.GITHUB_RELAY_DOMAIN }}
        run: |
          set -eu
          test "${#RELAY_SHARED_SECRET}" -ge 32
          test -n "$RELAY_DOMAIN"
          command -v docker >/dev/null
          docker compose version >/dev/null
          command -v curl >/dev/null
      - name: Deploy GitHub self-hosted worker relay
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
          RELAY_DOMAIN: ${{ vars.GITHUB_RELAY_DOMAIN }}
        run: |
          set -eu
          secret_dir="$HOME/.config/link-to-cloud"
          secret_file="$secret_dir/relay-shared-secret"
          mkdir -p "$secret_dir"
          umask 077
          printf '%s' "$RELAY_SHARED_SECRET" > "$secret_file"
          chmod 600 "$secret_file"
          export RELAY_SHARED_SECRET_FILE="$secret_file"

          docker compose             --project-name link-to-cloud-github-relay             --file relay/github/compose.yml             up --detach --build --remove-orphans

          i=0
          until curl --fail --silent --show-error --max-time 5 "https://$RELAY_DOMAIN/relay" >/dev/null; do
            i=$((i + 1))
            if [ "$i" -ge 18 ]; then
              docker compose                 --project-name link-to-cloud-github-relay                 --file relay/github/compose.yml                 ps
              docker compose                 --project-name link-to-cloud-github-relay                 --file relay/github/compose.yml                 logs --tail=100
              exit 1
            fi
            sleep 5
          done
