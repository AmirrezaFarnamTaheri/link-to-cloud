name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          tag="v$version"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            released=true
          else
            released=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "image=$image"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.meta.outputs.released != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.meta.outputs.released != 'true'
        run: npm ci

      - name: Lint
        if: steps.meta.outputs.released != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.meta.outputs.released != 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.meta.outputs.released != 'true'
        run: npm test

      - name: Audit dependencies
        if: steps.meta.outputs.released != 'true'
        run: npm audit

      - name: Production build
        if: steps.meta.outputs.released != 'true'
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build

      - name: Sign in to GitHub Container Registry
        if: steps.meta.outputs.released != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production container
        if: steps.meta.outputs.released != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build             --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"             --label "org.opencontainers.image.revision=${GITHUB_SHA}"             --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}"             --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"             --tag "${{ steps.meta.outputs.image }}:latest"             .

      - name: Publish production container
        if: steps.meta.outputs.released != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

      - name: Create GitHub release
        if: steps.meta.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.meta.outputs.tag }}"             --target "${GITHUB_SHA}"             --title "Link-to-Cloud ${{ steps.meta.outputs.tag }}"             --generate-notes

      - name: Existing release
        if: steps.meta.outputs.released == 'true'
        run: echo "Release ${{ steps.meta.outputs.tag }} already exists; nothing to publish."
